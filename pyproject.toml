[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "antiviral-qsar"
version = "0.1.0"
description = "Evidence-preserving antiviral measurements collector for local QSAR research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
dependencies = [
  "typer>=0.15,<1", "rich>=13,<15", "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "rdkit>=2024.9", "lxml>=5,<7",
  "pymupdf>=1.25,<2", "openpyxl>=3.1,<4", "psutil>=6,<8",
  "huggingface-hub>=0.30",
]

[project.optional-dependencies]
mlx = ["mlx-lm==0.32.2"]
dev = ["pytest>=8,<10", "pytest-httpx>=0.35", "ruff>=0.9"]

[project.scripts]
antiviral-qsar = "antiviral_qsar.cli:app"

[project.urls]
Repository = "https://github.com/Samoilov2004/AntiviralQsar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
